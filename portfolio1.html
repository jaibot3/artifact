<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <title>Work — Portfolio</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      min-height:100%;
      background:#eff2f0;
      color:#1c1a18;
      font-family:'Google Sans','Jost','Century Gothic', CenturyGothic, AppleGothic, sans-serif;
      -webkit-text-size-adjust:100%;
    }
    body { overflow-x:hidden; }

    /* 우상단 Index */
    .top { display:flex; justify-content:flex-end; padding:36px 6% 0; position:relative; z-index:20; }
    .back {
      font-size:10px; letter-spacing:3px; text-transform:uppercase;
      color:#8a7f70; text-decoration:none; transition:color .3s;
    }
    .back:hover { color:#1c1a18; }

    /* Work — work1.html 위치·크기, 좌상단 고정, 색 검정.
       pointer-events:none → 겹친 이미지 클릭을 막지 않음 */
    .page-title {
      font-size:76px; font-weight:700; color:#1c1a18;
      line-height:1; letter-spacing:0.5px;
      position:fixed; top:0; left:0; margin:0;
      z-index:30; pointer-events:none;
    }

    /* 프로젝트 리스트 — 이미지 왼쪽 여백 0(flush), 상단 Work와 겹침 */
    .projects {
      display:flex; flex-direction:column; gap:72px;
      padding:60px 6% 120px 6px;      /* 왼쪽 0 / 오른쪽 6% / 위 60px(=Work와 살짝 겹침) */
    }
    .project {
      display:grid;
      grid-template-columns:2fr 1fr;   /* 이미지 2 : 글 1 */
      gap:40px;
      align-items:start;
    }
    .thumb { display:block; overflow:hidden; text-decoration:none; background:#2b2b2b; }
    .thumb img {
      width:100%;
      aspect-ratio:16/9;          /* 원본 비율 그대로 쓰려면 이 줄 삭제 */
      object-fit:cover;
      display:block;
      transition:opacity .35s ease;
      background:#2b2b2b;
    }
    .thumb:hover img { opacity:.86; }
    .img-ph {
      width:100%; aspect-ratio:16/9; background:#2b2b2b;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; letter-spacing:3px; color:#8f8f8f; text-transform:uppercase;
    }

    .meta { padding-top:6px; }
    .project-name {
      display:inline-block;
      font-size:30px; font-weight:400; color:#1c1a18; text-decoration:none;
      letter-spacing:-0.3px; line-height:1.1;
      transition:transform .25s cubic-bezier(.25,.8,.25,1), opacity .25s ease;
    }
    .project-name:hover { transform:translateX(10px); opacity:.55; }
    .desc { margin-top:18px; font-size:13px; line-height:1.7; color:#5c5b5a; white-space:pre-wrap; }

    @media (max-width:740px) {
      .top { padding:28px 5% 0; }
      .page-title { font-size:44px; }
      .projects { gap:48px; padding:64px 5% 90px 0; }
      .project { grid-template-columns:1fr; gap:14px; }
      .project-name { font-size:24px; }
    }
  </style>
</head>
<body>

  <div class="top"><a class="back" href="index.html">← Index</a></div>
  <h1 class="page-title">Work</h1>

  <!-- ▼▼▼ 프로젝트 목록 — <article> 복사해서 계속 추가 (반드시 </article> 로 닫기!) ▼▼▼ -->
  <div class="projects">

    <article class="project">
      <a class="thumb" href="portfolio1_0.html">
        <img src="das.jpg" alt="Project 01"
             onerror="this.outerHTML='&lt;div class=\'img-ph\'&gt;image1&lt;/div&gt;'">
      </a>
      <div class="meta">
        <a class="project-name" href="portfolio1_0.html">Das Ding. 2026 SAKK</a>
        <div class="desc">Das ding
“Back to basic” 시즌 컨셉 진행
하이데거 Das Ding의 개념과 Brancusi의 조각 형태 구현 방식을 가져와
기본적인 디자인을 제안</div>
      </div>
    </article>

    <article class="project">
      <a class="thumb" href="portfolio1_00.html">
        <img src="lethe.jpg" alt="Project 02"
             onerror="this.outerHTML='&lt;div class=\'img-ph\'&gt;image1&lt;/div&gt;'">
      </a>
      <div class="meta">
        <a class="project-name" href="portfolio1_00.html">Lethe,Still shimmering</a>
        <div class="desc"></div>
      </div>
    </article>

    <article class="project">
      <a class="thumb" href="portfolio1_01.html">
        <img src="ao.jpg" alt="Project 03"
             onerror="this.outerHTML='&lt;div class=\'img-ph\'&gt;image1&lt;/div&gt;'">
      </a>
      <div class="meta">
        <a class="project-name" href="portfolio1_01.html">AOLADO</a>
        <div class="desc"></div>
      </div>
    </article>

    <article class="project">
      <a class="thumb" href="portfolio1_02.html">
        <img src="gap1.jpg" alt="Project 04"
             onerror="this.outerHTML='&lt;div class=\'img-ph\'&gt;image1&lt;/div&gt;'">
      </a>
      <div class="meta">
        <a class="project-name" href="portfolio1_02.html">GAP</a>
        <div class="desc"></div>
      </div>
    </article>

    <article class="project">
      <a class="thumb" href="portfolio1_03.html">
        <img src="kom.jpg" alt="Project 05"
             onerror="this.outerHTML='&lt;div class=\'img-ph\'&gt;image1&lt;/div&gt;'">
      </a>
      <div class="meta">
        <a class="project-name" href="portfolio1_03.html">Kommt. Art gallery</a>
        <div class="desc"></div>
      </div>
    </article>

  </div>
  <!-- ▲▲▲ 여기까지 ▲▲▲ -->

</body>
</html>
