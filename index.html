<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ficciones — index</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Jost:wght@400;700&display=swap" rel="stylesheet">
<!-- 인덱스: 카노바 석고상 미술관 평면도를 가로로 눕힌 도면. 각 공간(섹션)이 링크.
     조각상은 새로고침할 때마다 섹션 안 여러 자리 중 무작위로 놓이고 크기도 조금씩 바뀜 (클릭은 섹션에만 걸림).
     이전 인덱스(손 그림자)는 index00.html. 섹션 위치·링크는 아래 .sec 의 style / href 만 바꾸면 됨. -->
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#fff;color:#080808;font-family:'Instrument Sans','Google Sans','Jost','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  display:grid;grid-template-rows:auto 1fr;overflow:hidden}

/* ── 상단 내비게이션: 지금 가리키는 곳 위에 세모가 깜빡임 ── */
.nav{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 3% 14px}
.mark{font:700 23px/1 'Instrument Sans','Jost',sans-serif;letter-spacing:-.05em;color:#080808;text-decoration:none}
.nav ul{list-style:none;margin:0;padding:0;display:flex;gap:26px}
.nav li{position:relative}
.nav li a{display:block;color:#080808;text-decoration:none;font-size:15px;font-weight:600;padding-top:14px}
.nav li a small{font-weight:400;color:#8a7f70;margin-right:3px}
.nav li.on::before{content:'';position:absolute;top:0;left:50%;margin-left:-5px;
  border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid #080808;
  animation:blink 1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}

/* ── 도면 ── */
.stage{position:relative;display:grid;place-items:center;min-height:0;padding:8px 3% 24px}
.plan{position:relative;aspect-ratio:1110/1050;height:min(100%,calc((100vw - 6%) * 1050/1110));max-width:100%}
.plan > img.base{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.sec{position:absolute;display:block;z-index:4;outline:none}   /* 이름표·노랑 칠이 조각상 위로 */
.sec span{position:absolute;left:6px;top:5px;font-size:11px;font-weight:600;letter-spacing:.02em;color:#080808;background:#fff;padding:1px 4px;white-space:nowrap}
.sec::after{content:'';position:absolute;inset:0;background:#eaf751;mix-blend-mode:multiply;opacity:0;transition:opacity .2s}
.sec:hover::after,.sec:focus-visible::after,.sec.on::after{opacity:1}
.statue{position:absolute;z-index:3;pointer-events:none;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.16));opacity:0;transition:opacity .6s ease}
.statue.in{opacity:1}

@media (max-width:740px){
  .nav{flex-direction:column;align-items:flex-start;padding:16px 5% 8px;gap:8px}
  .nav ul{gap:4px 12px;flex-wrap:wrap}
  .nav li a{font-size:13px}
  .sec span{font-size:9px;left:3px;top:3px}
}
@media (prefers-reduced-motion:reduce){.nav li.on::before{animation:none}.statue{transition:none}}
</style></head>
<body>
<header class="nav">
  <a class="mark" href="index.html">ficciones</a>
  <ul id="nav">
    <li data-id="index" class="on"><a href="index.html">index</a></li>
    <li data-id="work"><a href="portfolio1.html"><small>(1)</small>work</a></li>
    <li data-id="career"><a href="career.html"><small>(2)</small>career</a></li>
    <li data-id="ficciones"><a href="rose.html"><small>(3)</small>ficciones</a></li>
    <li data-id="sakk"><a href="https://www.sakk.co.kr/" target="_blank" rel="noopener"><small>(4)</small>sakk</a></li>
    <li data-id="index00"><a href="index00.html"><small>(0)</small>previous</a></li>
  </ul>
</header>

<main class="stage">
  <div class="plan" id="plan">
    <img class="base" src="idx_plan.webp" alt="카노바 석고상 미술관 평면도">
    <!-- 섹션: 위치는 도면 대비 % -->
    <a class="sec" data-id="work"      href="portfolio1.html"                                  style="left:20.54%;top:36.00%;width:65.32%;height:24.76%"><span>(1) work</span></a>
    <a class="sec" data-id="career"    href="career.html"                                      style="left:9.28%;top:1.05%;width:31.53%;height:29.71%"><span>(2) career</span></a>
    <a class="sec" data-id="ficciones" href="rose.html"                                        style="left:39.91%;top:67.90%;width:32.43%;height:31.43%"><span>(3) ficciones</span></a>
    <a class="sec" data-id="sakk"      href="https://www.sakk.co.kr/" target="_blank" rel="noopener" style="left:85.86%;top:35.52%;width:13.06%;height:26.19%"><span>(4) sakk</span></a>
    <a class="sec" data-id="index00"   href="index00.html"                                     style="left:0.72%;top:30.76%;width:19.82%;height:33.81%"><span>(0) previous</span></a>
  </div>
</main>

<script>
(() => {
  const plan = document.getElementById('plan');
  const navItems = [...document.querySelectorAll('#nav li')];
  const secs = [...document.querySelectorAll('.sec')];

  // 세모: 가리키는 섹션의 메뉴 위로 이동, 벗어나면 index(현재 위치)로 돌아옴
  const point = id => {
    navItems.forEach(li => li.classList.toggle('on', li.dataset.id === id));
    secs.forEach(s => s.classList.toggle('on', s.dataset.id === id));
  };
  secs.forEach(s => {
    s.addEventListener('mouseenter', () => point(s.dataset.id));
    s.addEventListener('focus', () => point(s.dataset.id));
    s.addEventListener('mouseleave', () => point('index'));
    s.addEventListener('blur', () => point('index'));
  });
  navItems.forEach(li => {
    li.addEventListener('mouseenter', () => point(li.dataset.id));
    li.addEventListener('mouseleave', () => point('index'));
  });

  // 조각상: 새로고침마다 섹션 안 자리(SPOTS) 중 4곳을 골라 놓음. 크기는 자리 높이의 55~95%.
  const STATUES = [
    { src: 'idx_skeleton.webp', r: 387/420 },
    { src: 'idx_head.webp',     r: 166/256 },
    { src: 'idx_hera.webp',     r: 233/420 },
    { src: 'idx_rider.webp',    r: 420/418 },
  ];
  // 섹션 안 자리 [left, top, width, height] (도면 대비 %)
  const SPOTS = [
    [21.44,37.43,21.62,21.90],   // 전시홀 왼쪽
    [43.06,37.43,21.62,21.90],   // 전시홀 가운데
    [64.68,37.43,20.72,21.90],   // 전시홀 오른쪽
    [10.63, 2.19,28.83,27.62],   // career 동
    [41.26,68.86,29.73,29.52],   // ficciones 동
    [ 1.62,31.71,18.47,31.90],   // 입구
    [86.31,37.43,12.16,22.38],   // 반원 끝
  ];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const ratio = 1110 / 1050;   // 도면 가로/세로
  const spots = shuffle(SPOTS.slice());
  shuffle(STATUES.slice()).forEach((s, i) => {
    const [L, T, Wd, Ht] = spots[i];
    let h = Ht * (0.55 + Math.random() * 0.4);              // 높이 % (도면 세로 대비)
    let w = h * s.r / ratio;                                // 가로 % (도면 가로 대비)
    if (w > Wd * 0.95) { w = Wd * 0.95; h = w * ratio / s.r; }
    const x = L + Math.random() * (Wd - w);
    const y = T + Math.random() * (Ht - h);
    const img = new Image();
    img.className = 'statue'; img.alt = ''; img.src = s.src;
    img.style.cssText = `left:${x}%;top:${y}%;width:${w}%;height:${h}%;object-fit:contain;` +
                        (Math.random() < .5 ? 'transform:scaleX(-1);' : '');
    img.onload = () => img.classList.add('in');
    plan.appendChild(img);
  });
})();
</script>
</body></html>
