<!-- 인덱스: 카노바 석고상 미술관 평면도를 가로로 눕힌 도면. 각 공간(섹션)이 링크.
     조각상은 새로고침할 때마다 무작위 방·자리·크기로 놓이고, 그 방 안에서만 천천히 돌아다님 (클릭은 섹션에만 걸림).
     섹션 위치·링크는 아래 .sec 의 style / href 만 바꾸면 됨. -->
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#fff;color:#080808;font-family:'Instrument Sans','Google Sans','Jost','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  display:grid;grid-template-rows:auto 1fr;overflow:hidden}

/* ── 상단 내비게이션: 지금 가리키는 곳 위에 세모가 깜빡임 ── */
.nav{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 3% 14px}
.mark{font:700 23px/1 'Instrument Sans','Jost',sans-serif;letter-spacing:-.05em;color:#080808;text-decoration:none}
.nav ul{list-style:none;margin:0;padding:0;display:flex;gap:26px}
.nav li{position:relative}
.nav li a{display:block;color:#080808;text-decoration:none;font-size:15px;font-weight:600;padding-top:14px}
.nav li a small{font-weight:400;color:#8a7f70;margin-right:3px}
.nav li a{padding-top:20px}
.nav li.on::before{content:'';position:absolute;top:0;left:50%;width:16px;height:13px;margin-left:-8px;
  background:#c3d200;clip-path:polygon(0 0,100% 0,50% 100%);   /* 연두를 더 진하게 */
  animation:spin 1.6s linear infinite}
@keyframes spin{from{transform:perspective(60px) rotateY(0)}to{transform:perspective(60px) rotateY(360deg)}}

/* ── 도면 ── */
.stage{position:relative;display:grid;place-items:center;min-height:0;padding:8px 3% 24px}
.plan{position:relative;aspect-ratio:1110/1050;height:min(100%,calc((100vw - 6%) * 1050/1110));max-width:100%}
.plan > img.base{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.sec{position:absolute;display:block;z-index:4;outline:none}   /* 이름표·노랑 칠이 조각상 위로 */
.sec span{position:absolute;left:6px;top:5px;font-size:11px;font-weight:600;letter-spacing:.02em;color:#080808;background:#fff;padding:1px 4px;white-space:nowrap}
.sec::after{content:'';position:absolute;inset:0;background:#eaf751;mix-blend-mode:multiply;opacity:0;transition:opacity .2s}
.sec:hover::after,.sec:focus-visible::after,.sec.on::after{opacity:.7}
.statue{position:absolute;z-index:3;pointer-events:none;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.16));opacity:0;transition:opacity .6s ease;will-change:left,top}
.statue.in{opacity:1}

@media (max-width:740px){
  .nav{flex-direction:column;align-items:flex-start;padding:16px 5% 8px;gap:8px}
  .nav ul{gap:4px 12px;flex-wrap:wrap}
  .nav li a{font-size:13px}
  .sec span{font-size:9px;left:3px;top:3px}
}
/* 도면 출처: 미술관 작품 캡션 같은 흰 종이 */
.caption{position:absolute;left:calc(100% + 48px);bottom:0;margin:0;z-index:5;background:#fff;padding:9px 12px 10px;width:max-content;max-width:240px;   /* PC: 도면 오른쪽, 떨어뜨려서 */
 
  font-size:11px;line-height:1.45;color:#080808;box-shadow:0 1px 2px rgba(0,0,0,.18),0 4px 12px rgba(0,0,0,.08)}
.caption b{display:block;font-weight:600;font-size:12px}
.caption i{display:block;font-style:italic}
.caption small{display:block;margin-top:5px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#8a7f70}
.caption small span{text-transform:none;letter-spacing:.02em}
@media (min-width:741px){.plan{max-width:calc(100vw - 6% - 600px)}.caption{max-width:none}.caption small{white-space:nowrap}}   /* 양옆에 캡션 자리 확보 → 도면은 가운데 */
@media (max-width:740px){.caption{left:auto;right:0;bottom:auto;top:calc(100% + 28px);max-width:70%}}   /* 모바일: 도면 아래 */
@media (prefers-reduced-motion:reduce){.nav li.on::before{animation:none}.statue{transition:none}}

/* SAKK — closed room */
.sec[data-id="sakk"],#nav [data-id="sakk"] a{cursor:not-allowed}
.sec[data-id="sakk"]::after{opacity:0!important}
.sec[data-id="sakk"]::before{content:"";position:absolute;inset:0;z-index:7;opacity:.7;background:linear-gradient(to top right,transparent calc(50% - 3px),#ed1515 calc(50% - 3px),#ed1515 calc(50% + 3px),transparent calc(50% + 3px)),linear-gradient(to bottom right,transparent calc(50% - 3px),#ed1515 calc(50% - 3px),#ed1515 calc(50% + 3px),transparent calc(50% + 3px))}
.sec[data-id="sakk"] span::after{content:" / 출입불가";color:#d21b1b;font-size:9px}
#nav [data-id="sakk"] a{text-decoration:line-through;text-decoration-color:rgba(237,21,21,.7)}
#fortune-cookie{position:fixed;left:0;top:0;width:156px;height:142px;z-index:12;touch-action:none;cursor:grab;user-select:none;border:0;background:transparent;padding:0;will-change:transform}
#fortune-cookie:active{cursor:grabbing}
#fortune-cookie:focus-visible{outline:1px dashed #b28a51;border-radius:50%}
#fortune-cookie canvas{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 8px 7px #62421b26)}
.cookie-hint{position:absolute;bottom:1px;left:0;right:0;font-size:9px;letter-spacing:.06em;color:#8a7f70;text-align:center;pointer-events:none}
#fortune-slip{position:fixed;inset:0;border:0;background:#fdf9eb;color:#312718;width:min(360px,calc(100vw - 40px));padding:30px 28px 24px;box-shadow:0 12px 55px #35230930;font-family:inherit;transform:rotate(-2deg)}
#fortune-slip::backdrop{background:#ffffff70;backdrop-filter:blur(3px)}
#fortune-slip small{font-size:10px;letter-spacing:.12em;color:#8a7f70}
#fortune-slip h2{font-size:16px;font-weight:500;margin:18px 0}
#fortune-slip p{font-size:14px;line-height:1.8;word-break:keep-all}
#fortune-slip button{display:block;margin:20px 0 0 auto;border:0;background:none;cursor:pointer;font:12px inherit;color:#8a7f70;padding:8px}
@media(max-width:740px){#fortune-cookie{width:124px;height:116px}}

<script>
(() => {
  const plan = document.getElementById('plan');
  const navItems = [...document.querySelectorAll('#nav li')];
  const secs = [...document.querySelectorAll('.sec')];

  // 세모: 가리키는 섹션의 메뉴 위로 이동, 벗어나면 index(현재 위치)로 돌아옴
  const point = id => {
    navItems.forEach(li => li.classList.toggle('on', li.dataset.id === id));
    const lit = id === 'index' ? 'career' : id;   // 기본 상태: 도면의 초록 칠은 career에 켜져 있음
    secs.forEach(s => s.classList.toggle('on', s.dataset.id === lit));
  };
  point('index');
  secs.forEach(s => {
    s.addEventListener('mouseenter', () => point(s.dataset.id));
    s.addEventListener('focus', () => point(s.dataset.id));
    s.addEventListener('mouseleave', () => point('index'));
    s.addEventListener('blur', () => point('index'));
  });
  navItems.forEach(li => {
    li.addEventListener('mouseenter', () => point(li.dataset.id));
    li.addEventListener('mouseleave', () => point('index'));
  });

  // 조각상: 새로고침마다 방(ROOMS)을 골라 무작위 자리에 놓고, 그 방 안에서만 천천히 돌아다님.
  const STATUES = [
    { src: 'idx_skeleton.webp', r: 387/420 },
    { src: 'idx_head.webp',     r: 166/256 },
    { src: 'idx_hera.webp',     r: 233/420 },
    { src: 'idx_rider.webp',    r: 420/418 },
  ];
  // 방 안쪽 [left, top, width, height] (도면 대비 %). 전시홀은 넓어서 두 번 뽑힐 수 있음.
  const NAVE = [21.44,37.43,63.96,21.90];
  const ROOMS = [
    NAVE, NAVE,
    [10.63, 2.19,28.83,27.62],   // career 동
    [41.26,68.86,29.73,29.52],   // ficciones 동
    [ 1.62,31.71,18.47,31.90],   // 입구
    [86.31,37.43,12.16,22.38],   // 반원 끝
  ];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const ratio = 1110 / 1050;   // 도면 가로/세로
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rooms = shuffle(ROOMS.slice());

  const walkers = shuffle(STATUES.slice()).map((s, i) => {
    const [L, T, Wd, Ht] = rooms[i];
    let h = Math.min(Ht, 22) * rnd(.55, .95) * (innerWidth < 740 ? 1.4 : 1);   // 높이 % (도면 세로 대비), 모바일은 1.4배
    h = Math.min(h, Ht * .98);                              // 방 높이는 넘지 않게
    let w = h * s.r / ratio;                                // 가로 % (도면 가로 대비)
    if (w > Wd * .9) { w = Wd * .9; h = w * ratio / s.r; }
    const box = { x0: L, x1: L + Wd - w, y0: T, y1: T + Ht - h };   // 왼쪽 위 꼭짓점이 움직일 수 있는 범위
    const img = new Image();
    img.className = 'statue'; img.alt = ''; img.src = s.src;
    img.style.width = w + '%'; img.style.height = h + '%'; img.style.objectFit = 'contain';
    img.onload = () => img.classList.add('in');
    plan.appendChild(img);
    const m = { img, box, x: rnd(box.x0, box.x1), y: rnd(box.y0, box.y1), tx: 0, ty: 0,
                speed: rnd(1.2, 2.6), wait: rnd(0, 1.5), face: Math.random() < .5 ? 1 : -1 };
    pick(m); place(m);
    return m;
  });

  function pick(m) { m.tx = rnd(m.box.x0, m.box.x1); m.ty = rnd(m.box.y0, m.box.y1); }
  function place(m) {
    m.img.style.left = m.x + '%'; m.img.style.top = m.y + '%';
    m.img.style.transform = m.face < 0 ? 'scaleX(-1)' : '';
  }

  // 천천히 걷다가 멈췄다가 다시 다른 곳으로 (방 밖으로는 나가지 않음)
  let last = 0;
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, .1) : 0; last = now;
    for (const m of walkers) {
      if (m.wait > 0) { m.wait -= dt; continue; }
      const dx = m.tx - m.x, dy = m.ty - m.y, d = Math.hypot(dx, dy);
      if (d < .3) { m.wait = rnd(.8, 3); pick(m); continue; }
      const step = Math.min(d, m.speed * dt);
      m.x += dx / d * step; m.y += dy / d * step;
      if (Math.abs(dx) > .5) m.face = dx > 0 ? 1 : -1;
      place(m);
    }
    requestAnimationFrame(tick);
  }
  if (!still) requestAnimationFrame(tick);
})();

// 클릭 소리: 우주선 버튼 같은 짧은 '삐용' (파일 없이 브라우저에서 합성). 소리가 들리도록 0.15초 뒤에 이동.
(() => {
  let ac = null;
  const audio = () => (ac = ac || new (window.AudioContext || window.webkitAudioContext)());
  function beep() {
    const a = audio(), t = a.currentTime;
    const out = a.createGain(); out.gain.value = .16;
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    lp.connect(out); out.connect(a.destination);
    // 1) 위로 쓸어올리는 두 겹 사각파
    [0, 7].forEach(det => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'square'; o.detune.value = det;
      o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(1560, t + .09);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5, t + .005); g.gain.exponentialRampToValueAtTime(.001, t + .13);
      o.connect(g); g.connect(lp); o.start(t); o.stop(t + .14);
    });
    // 2) 끝에 붙는 높은 '띵'
    const o2 = a.createOscillator(), g2 = a.createGain();
    o2.type = 'sine'; o2.frequency.value = 2093;
    g2.gain.setValueAtTime(0, t + .07); g2.gain.linearRampToValueAtTime(.6, t + .075); g2.gain.exponentialRampToValueAtTime(.001, t + .2);
    o2.connect(g2); g2.connect(out); o2.start(t + .07); o2.stop(t + .21);
  }
  document.querySelectorAll('.sec:not([aria-disabled]), #nav a:not([aria-disabled]), .mark').forEach(el => {
    el.addEventListener('click', e => {
      try { beep(); } catch (_) { return; }                 // 소리를 못 내는 환경이면 그냥 이동
      if (el.target === '_blank' || e.metaKey || e.ctrlKey || e.shiftKey) return;   // 새 탭은 바로 열림
      e.preventDefault();
      setTimeout(() => { location.href = el.href; }, 150);
    });
  });
})();
</script>

<script>
(() => {
const el=document.querySelector('#fortune-cookie'),cv=el.querySelector('canvas'),ctx=cv.getContext('2d'),slip=document.querySelector('#fortune-slip');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let w,h,x=innerWidth*.72,y=innerHeight*.56,vx=19,vy=-13,ax=-.65,ay=.25,rx=0,ry=.18,drag=null,hover=false,last=0;
function resize(){w=el.clientWidth;h=el.clientHeight;const d=Math.min(devicePixelRatio||1,2);cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0);x=Math.max(0,Math.min(x,innerWidth-w));y=Math.max(0,Math.min(y,innerHeight-h));}
resize();addEventListener('resize',resize);
// A pinched, tapered crescent shell, with a narrow baked seam.
const verts=[],faces=[],U=56,V=24;
for(let i=0;i<=U;i++){
 const t=i/U,a=-2.35+t*4.7,taper=Math.pow(Math.sin(Math.PI*t),.55),r=.39*taper+.008;
 for(let j=0;j<=V;j++){
  const b=j/V*Math.PI*2,fold=1-.18*Math.pow(Math.cos(b),8);
  verts.push([(0.69+r*Math.cos(b)*fold)*Math.sin(a),(0.69+r*Math.cos(b)*fold)*Math.cos(a)-.12,r*Math.sin(b)*.78]);
 }
}
for(let i=0;i<U;i++)for(let j=0;j<V;j++){
 const a=i*(V+1)+j,b=a+V+1;faces.push([a,b,a+1,j],[a+1,b,b+1,j]);
}
function rotate(p){const c=Math.cos(ay),s=Math.sin(ay),c2=Math.cos(ax),s2=Math.sin(ax),xx=p[0]*c+p[2]*s,zz=-p[0]*s+p[2]*c;return[xx,p[1]*c2-zz*s2,p[1]*s2+zz*c2];}
function draw(){
 ctx.clearRect(0,0,w,h);
 const ps=verts.map(rotate),scale=w*.37;
 const projected=ps.map(p=>{const f=4/(4-p[2]);return[w/2+p[0]*scale*f,h*.46-p[1]*scale*f];});
 const sorted=faces.map(f=>({f,z:(ps[f[0]][2]+ps[f[1]][2]+ps[f[2]][2])/3})).sort((a,b)=>a.z-b.z);
 for(const {f} of sorted){
  const a=ps[f[0]],b=ps[f[1]],c=ps[f[2]],u=b.map((v,i)=>v-a[i]),v=c.map((v,i)=>v-a[i]);
  let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],len=Math.hypot(...n)||1;
  const light=.52+.48*Math.abs((n[0]*-.4+n[1]*.6+n[2]*.7)/len),seam=(f[3]===0||f[3]===V/2)?.77:1;
  const noise=1+.035*Math.sin(f[0]*12.9898),tone=light*seam*noise;
  ctx.fillStyle='rgb('+[238,181,94].map(c=>Math.round(c*tone)).join(',')+')';
  ctx.beginPath();f.slice(0,3).forEach((id,i)=>{const p=projected[id];i?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.closePath();ctx.fill();ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=.45;ctx.stroke();
 }
}
const fortunes=[
'미뤄둔 질문 하나를 꺼내면, 예상하지 못한 문이 열린다.',
'오늘의 행운은 덜어내는 쪽에 있다. 하나를 포기하면 하나가 선명해진다.',
'낯선 제안을 바로 거절하지 말 것. 쓸모는 첫인상보다 늦게 도착한다.',
'생각보다 작은 시작이 멀리 간다. 완성보다 첫 움직임을 택할 것.',
'답을 찾으려 애쓰는 대신 질문의 방향을 바꿔볼 것.',
'우연히 눈에 들어온 사물이 오늘의 단서가 된다.',
'서두르지 않는 사람이 놓친 것을 발견한다. 오늘은 한 번 더 볼 것.',
'오래된 일을 다른 방식으로 해보면 새로운 길이 생긴다.',
'말을 줄이고 하나를 보여줄 것. 작은 결과가 큰 설명을 대신한다.',
'오늘은 타이밍보다 선택이 중요하다. 결정 하나를 끝낼 것.',
'뜻밖의 연결은 익숙한 바깥에서 생긴다. 평소와 다른 길로 갈 것.',
'남겨둔 빈자리가 좋은 것을 불러온다. 일정 하나를 비워둘 것.',
'거절 하나가 필요한 날. 여유가 생긴 곳에 운이 들어온다.',
'마무리에 운이 있다. 시작한 일 중 가장 작은 것부터 끝낼 것.',
'당연하다고 여긴 조건 하나를 의심하면 선택지가 늘어난다.',
'기다리던 신호는 작은 형태로 온다. 지나치지 말 것.'
];
function open(){
 if(slip.open)return;
 const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 let seed=2166136261;for(const c of date)seed=Math.imul(seed^c.charCodeAt(0),16777619);seed>>>=0;
 document.querySelector('#fortune-date').textContent=date+' · FORTUNE COOKIE';
 document.querySelector('#fortune-text').textContent=fortunes[seed%fortunes.length];
 document.querySelector('#fortune-luck').textContent='행운의 숫자 '+(seed%9+1)+' · FOR FUN';
 slip.showModal();
}
el.addEventListener('dblclick',open);
el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
slip.querySelector('button').addEventListener('click',()=>slip.close());
slip.addEventListener('click',e=>{if(e.target===slip){const r=slip.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)slip.close();}});
el.addEventListener('pointerenter',()=>hover=true);el.addEventListener('pointerleave',()=>hover=false);
el.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};rx=ry=0;el.setPointerCapture(e.pointerId);});
el.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 ay+=dx*.022;ax+=dy*.022;ry=dx*.8;rx=dy*.8;drag.x=e.clientX;drag.y=e.clientY;draw();});
let tapTime=0;
function release(e){if(!drag||e.pointerId!==drag.id)return;
 const tapped=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<8;
 if(e.type!=='pointercancel'&&e.pointerType==='touch'&&tapped){const now=performance.now();if(now-tapTime<350){open();tapTime=0;}else tapTime=now;}
 drag=null;
}
el.addEventListener('pointerup',release);el.addEventListener('pointercancel',release);el.addEventListener('lostpointercapture',()=>drag=null);
function frame(now){
 const dt=last?Math.min((now-last)/1000,.04):0;last=now;
 if(!drag&&!slip.open){
  if(!reduce&&!hover){x+=vx*dt;y+=vy*dt;if(x<=0||x>=innerWidth-w){vx=-vx;x=Math.max(0,Math.min(x,innerWidth-w));}if(y<=0||y>=innerHeight-h){vy=-vy;y=Math.max(0,Math.min(y,innerHeight-h));}}
  ax+=rx*dt;ay+=ry*dt;rx*=Math.exp(-2.4*dt);ry*=Math.exp(-2.4*dt);
  if(!reduce)ay+=.13*dt;
 }
 el.style.transform='translate3d('+x+'px,'+y+'px,0)';
 draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
