<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary · Art Reading</title><style>:root{--bg:#f9f8f5;--ink:#252522;--muted:#77766f;--line:#d8d6d0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}header,main,footer{max-width:1100px;margin:auto;padding:24px}header{padding-top:50px}nav{display:flex;gap:22px;font-size:13px;letter-spacing:.03em}a{color:inherit;text-underline-offset:3px}h1{font-family:Georgia,serif;font-size:clamp(34px,6vw,64px);font-weight:400;letter-spacing:-.05em;margin:40px 0 14px}h2{font-weight:500;font-size:22px}p{line-height:1.75}.intro{max-width:760px;color:#5c5a55}.meta{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.11em}input,select{background:transparent;border:1px solid var(--line);border-radius:0;padding:12px;color:var(--ink);font:inherit}input{width:min(100%,430px)}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0}.item{border-top:1px solid var(--line);padding:22px 0;display:grid;grid-template-columns:120px 1fr;gap:30px}.item h2{font-family:Georgia,serif;font-size:27px;font-weight:400;margin:8px 0}.item .artist{font-size:14px}.item p{margin:12px 0;color:#56554f}.tags{font-size:12px;color:var(--muted)}.small{font-size:12px;color:var(--muted)}.pill{font-size:11px;padding:3px 6px;border:1px solid var(--line);margin-left:8px}footer{border-top:1px solid var(--line);font-size:12px;color:var(--muted);margin-top:50px}@media(max-width:600px){.item{grid-template-columns:1fr;gap:4px}header{padding-top:24px}.item h2{font-size:25px}} .term{display:grid;grid-template-columns:235px 1fr;gap:20px;border-top:1px solid var(--line);padding:14px 0}.term strong{font-family:Georgia,serif;font-size:20px;font-weight:400}.term p{margin:0 0 4px}.desc{font-size:13px;color:var(--muted)}@media(max-width:600px){.term{grid-template-columns:1fr;gap:5px}}</style></head><body><header><nav><a href="./index.html">READINGS</a><a href="./vocabulary.html">VOCABULARY</a><a href="https://github.com/jaibot3/artifact/tree/main/art-reading">GITHUB</a></nav><div class="meta" style="margin-top:42px">PERSONAL LEXICON</div><h1>Vocabulary</h1><p class="intro">학습지에 등장한 어휘의 뜻·뉘앙스·출현 날짜를 따로 찾아보는 단어장. 현재 수록된 것은 대화에서 확인되는 핵심 표현이며, 이전 PDF 전체의 모든 단어를 추출한 완전판은 아니야.</p></header><main><div class="controls"><input id="search" placeholder="영어, 한국어, 날짜 검색" aria-label="단어 검색"><span class="small" id="count"></span></div><div id="terms"></div></main><footer>Definitions are paraphrases for study; exact nuance depends on context.</footer><script>const words=[["shibboleth","집단의 소속을 판별하는 말·관습","Hebrew biblical term; pronunciation as a test of belonging","2026-10-22, 2026-10-28"],["precarity","불안정한 처지, 구조적 취약성","Long-term social condition, rather than a momentary risk","2026-10-28"],["exclusion","배제","Exclusion = being kept out; omission = simply leaving out","2026-10-28"],["substantiate","근거를 제시하여 입증하다","Stronger than merely suggest","2026-10-28"],["structural vulnerability","구조적 취약성","Vulnerability rooted in institutions or conditions","2026-10-28"],["sensation","감각, 느낌","Immediate feeling, not necessarily understanding","2026-10-28"],["compliance","요구·규칙에 따름","Can happen without sincere agreement","2026-10-26"],["obedience","복종","Focuses on following authority","2026-10-26"],["consent","동의","A willing agreement, distinct from compliance","2026-10-26"],["coercion","강압, 강제","Pressure that constrains choice","2026-10-26"],["asymmetry","비대칭, 불균형","Asymmetry of power = unequal capacity to act","2026-10-26"],["unannounced","사전 고지되지 않은","Unlike unexpected, emphasizes no prior notice","2026-10-26"],["converge","한 지점으로 모이다, 수렴하다","Can remain distinct while approaching a common point","2026-10-27"],["merge","합쳐져 하나가 되다","More complete fusion than converge","2026-10-27"],["coexist","공존하다","Existing together without necessarily mixing","2026-10-27"],["blend","혼합되다","Individual properties may become less distinct","2026-10-27"],["mediate","매개하다, 중재하다","Act through or between elements; not just transmit","2026-10-27"],["transmit","전달하다, 전송하다","Emphasizes movement of sound/information","2026-10-27"],["interdependent","상호의존적인","Mutual reliance, not simple similarity","2026-10-25"],["spontaneous","자발적인, 자연발생적인","Not always random","2026-10-25"],["redistribute","재분배하다","Rearrange control rather than abolish it","2026-10-25"],["symbiosis","공생","Greek syn (together) + bios (life)","2026-10-25"],["absence","부재","What is missing, rather than necessarily destroyed","2026-10-24"],["material evidence","물질적 증거","A physical trace, not automatically a testimony","2026-10-24"],["testimony","증언","An account offered as evidence","2026-10-24"],["monument","기념물","Connected historically to Latin monere, to remind/warn","2026-10-24"],["agency","행위 주체성","Capacity to act, not the same as freedom from all constraints","2026-10-23"],["autonomy","자율성","Self-government or independent determination","2026-10-23"],["constraint","제약, 제한 조건","A condition that restricts what is possible","2026-10-23"],["immerse","몰입시키다, 담그다","From Latin immergere, to plunge into","2026-10-23"],["spectacle","구경거리, 장관","Can imply a visually impressive display","2026-10-23"],["intervention","개입","A deliberate action that changes an existing condition","2026-10-22"],["take for granted","당연하게 여기다","Assume without examining","2026-10-22"],["evoke","불러일으키다, 환기하다","Suggest an emotion or image, not prove it","2026-10-22"],["negotiate","협상하다, 조정하며 헤쳐 나가다","Often used of navigating a difficult space","2026-10-22"],["unsettle","불안하게 하다, 통념을 흔들다","Disturb established assumptions","2026-10-22"],["lived experience","몸소 겪은 경험","Different from a simulated sensation","2026-10-22"],["trace","흔적","A remaining mark of something absent","2026-10-21"],["intimacy","친밀함","Closeness or emotional proximity","2026-10-21"],["evoke mortality","죽음·유한성을 환기하다","Suggest finitude, not establish a literal death","2026-10-21"]];const search=document.querySelector('#search'),root=document.querySelector('#terms'),count=document.querySelector('#count');function render(){let q=search.value.toLowerCase(),a=words.filter(w=>w.join(' ').toLowerCase().includes(q)).sort((a,b)=>a[0].localeCompare(b[0]));count.textContent=a.length+' terms';root.replaceChildren();for(let w of a){let row=document.createElement('div');row.className='term';let strong=document.createElement('strong');strong.textContent=w[0];let cell=document.createElement('div');let p=document.createElement('p');p.textContent=w[1];let d=document.createElement('div');d.className='desc';d.textContent=w[2]+' · '+w[3];cell.append(p,d);row.append(strong,cell);root.append(row)}}search.oninput=render;render();</script></body></html>
