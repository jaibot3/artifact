<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blooming my million — Essay</title>
  
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  
  <style>
    /* Layout: portfolio1.html과 같은 서체·바탕·먹색. 본문은 흑백, 스크롤하면 생기는 얇은 바와 하단만 portfolio1의 핑크/노랑. */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg: #fff;
      --ink: #080808;
      --text: #222;
      --mute: #8a7f70;
      --pink: #f1cace;      /* portfolio1 하단·바 색 */
      --acid: #eaf751;
      --sans: 'Instrument Sans', 'Google Sans', 'Jost', 'Century Gothic', CenturyGothic, AppleGothic, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --fig-w: 546px;   /* 그림 가로 크기 — 이 숫자만 바꾸면 돼 (세로는 자동) */
    }
    
    html, body {
      min-height: 100%;
      background: var(--bg);
      font-family: var(--sans);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }
    
    body { min-height: 100vh; }
    .page { display: flex; justify-content: center; padding: 0 24px 120px; }
    
    /* ── 우상단 Index (portfolio1과 동일) ── */
    .top {
      position: absolute;
      top: 0; right: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding: 36px 6% 0;
      z-index: 100;
      pointer-events: none;
    }
    .back {
      pointer-events: auto;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--mute);
      text-decoration: none;
      transition: color .3s;
    }
    .back:hover { color: var(--ink); }
    
    /* ── 좌상단 Essay: portfolio1의 Work 자리·크기, 색은 검정 ── */
    .masthead {
      position: absolute;
      top: 0; left: 0;
      z-index: 30;
      pointer-events: none;
    }
    .masthead h1 {
      font-size: 76px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .5px;
      color: var(--ink);
    }
    .masthead p {
      margin-top: 4px;
      padding-left: 4px;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--mute);
    }
    
    /* ── 스크롤하면 생기는 얇은 바 (portfolio1과 같은 높이·글씨, 색은 핑크/노랑 중 랜덤) ── */
    .bar-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      height: 44px;
      padding: 0 3%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bar, var(--acid));
      transform: translateY(-100%);
      transition: transform .42s cubic-bezier(.2,.8,.2,1);
    }
    body.scrolled .bar-top { transform: none; }
    @media (prefers-reduced-motion: reduce) { .bar-top { transition: none; } }
    .bar-top a { color: var(--ink); text-decoration: none; transition: opacity .25s; }
    .bar-top a:hover { opacity: .55; }
    .bar-top .mark { font-size: 23px; font-weight: 700; letter-spacing: -.05em; }
    .bar-top .nav { display: flex; gap: 24px; font-size: 15px; font-weight: 600; }

    /* ── 하단 (portfolio1과 동일) ── */
    .foot {
      background: var(--pink);
      padding: 56px 6% 64px;
      display: flex; gap: 36px; flex-wrap: wrap; align-items: baseline;
    }
    .foot a { font-size: 22px; font-weight: 400; color: var(--acid); text-decoration: none; letter-spacing: -.2px; transition: opacity .25s; }
    .foot a:hover { opacity: .55; }
    .foot .small { margin-left: auto; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }

    /* ── 본문 ── */
    .sheet { position: relative; z-index: 1; width: 100%; max-width: 620px; padding-top: 150px; }
    .entries { display: flex; flex-direction: column; gap: 72px; }
    
    /* 글 머리: 제목(중간) + 날짜·요일(작게), 왼쪽 정렬 */
    .entry-head { margin-bottom: 16px; }
    .entry-head h2 {
      font-size: 30px;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -.3px;
      color: var(--ink);
    }
    .entry-head h2.untitled { color: var(--mute); }
    .entry-head time {
      display: block;
      margin-top: 8px;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--mute);
      font-variant-numeric: tabular-nums;
    }
    
    /* 본문: 줄 사이는 넉넉히, 문단 사이 빈칸은 좁게 */
    .entry-body {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text);
      letter-spacing: -.1px;
      word-break: keep-all;
      overflow-wrap: anywhere;
      user-select: none;
      -webkit-user-select: none;
    }
    .entry-body p { white-space: pre-wrap; }
    .entry-body .w { white-space: nowrap; }   /* 글자를 쪼개도 단어 중간에서 줄이 바뀌지 않게 */
    .entry-body p + p { margin-top: .5em; }
    
    .entry-body .ch {
      display: inline-block;
      transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1),
                  filter 0.55s ease,
                  opacity 0.55s ease;
      will-change: transform, filter, opacity;
    }
    
    /* ── 일기 그림: 한 장은 그대로, 여러 장은 좌우 슬라이드 ── */
    .entry-figs { margin: 0 0 20px; }
    .entry-figs > img { width: var(--fig-w); max-width: 100%; height: auto; display: block; }
    .slider { position: relative; }
    .slider .track {
      display: flex; align-items: center;
      overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
      scrollbar-width: none; outline: none;
    }
    .slider .track::-webkit-scrollbar { display: none; }
    .slider .track img {
      flex: 0 0 100%; width: 100%; max-height: 72vh; object-fit: contain;
      scroll-snap-align: center; display: block; -webkit-user-drag: none;
    }
    .slider .bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 8px; color: var(--mute);
      font-size: 12px; letter-spacing: 2px; font-variant-numeric: tabular-nums;
    }
    .slider .nav { display: flex; gap: 2px; }
    .slider button {
      background: none; border: 0; padding: 2px 8px;
      font-family: 'Jost', sans-serif; font-weight: 300; font-size: 26px; line-height: 1;
      color: var(--mute); cursor: pointer; transition: color .3s, opacity .3s;
    }
    .slider button:hover, .slider button:focus-visible { color: var(--ink); outline: none; }
    .slider button:disabled { opacity: .3; cursor: default; }
    
    .album-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-bottom: 26px; }
    .album-cover { position: relative; width: 100%; aspect-ratio: 1; overflow: hidden; background: #080808; }
    .album-cover img { position: absolute; width: 119.5286%; max-width: none; height: auto; left: -9.7643%; top: -38.7205%; display: block; }
    .album-card figcaption { margin-top: 10px; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
    .album-card .artist { display: block; margin-top: 3px; color: var(--mute); font-size: 12px; }
    @media (max-width: 420px) { .album-grid { gap: 12px; } .album-card figcaption { font-size: 12px; } }
    .empty { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--mute); padding: 80px 0; }

    /* ── 모바일 (portfolio1 기준) ── */
    @media (max-width: 740px) {
      .top { padding: 15px 5% 0; }
      .bar-top { height: 42px; padding: 0 5%; }
      .bar-top .mark { font-size: 21px; }
      .bar-top .nav { gap: 15px; font-size: 12px; }
      .foot { padding: 40px 5% 48px; gap: 24px; }
      .foot a { font-size: 18px; }
      .foot .small { margin-left: 0; width: 100%; }
      .masthead h1 { font-size: 44px; }
      .sheet { padding-top: 112px; }
      .entries { gap: 56px; }
      .entry-head h2 { font-size: 24px; }
      .entry-body { font-size: 15.5px; }
    }
  </style>
</head>

    text: `2 독서

궤변을 늘어놓다가 죽는 쇼를 하며 환심을 사려 하는,
처절하게 면을 판 구제불능의 나.
덧없다 노래하며 춤춰 보지만,
이미 마음 다 주고 더럽게 범해져 버린 순정파.
읊조리는 시구는 어디선가 이미 들어본 듯한, 다른 사람의 메아리.

선비인 양 곱게 차려입고 발목까지 오는 바다에 빠져 허우적거리며,

3 나는 너한테서 나는 빨래 향이 좋더라.


빨랫줄에 내 젖은 삶을 걸어 놓은 지 며칠 됐다. 몇 주 정도 됐다.
언제든지 말라 주겠지 하며 걸어 놓은 내 삶은 거기에 그대로.
나는 그 빨랫줄 걸린 반지하, 햇빛 하나 들어오지 않는 골목 귀퉁이에 쪼그려 앉아 내 삶이 마르기만을 바라보고 있다.

4 너, 섬

흐르는 시간 속에서 나는 무력하게도 무성한 나무에 가려진
너의 황량한 대지를 안아줄 수가 없다.
네가 그러하듯이.

나에게 차가운 바다가 있어 너를 섬으로 외로이 만들고,

빨갛게 물든 밤이면, 나는 너로 물든 나의 나무들을 베어내고는 그저 소리 없는 신음을 눈물로 안을 뿐.

(() => {
  const BAR = ['#f1cace', '#eaf751'];   // portfolio1의 핑크, 노랑
  document.documentElement.style.setProperty('--bar', BAR[Math.floor(Math.random() * BAR.length)]);

  sync(); window.addEventListener('scroll', sync, { passive: true });
})();

(() => {
  const WEEKDAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  const $list = document.getElementById('entries');

  if (!ENTRIES.length) { 
    $list.innerHTML = '<div class="empty">no entries yet.</div>'; 
    return; 
  }

  const sortedDesc = [...ENTRIES].sort((a, b) => b.date.localeCompare(a.date));

  function fmt(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return { 
      date: `${y}.${String(m).padStart(2, '0')}.${String(d).padStart(2, '0')}`, 
      wd: WEEKDAYS[dt.getDay()] 
    };
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[c]);
  }

  $list.innerHTML = sortedDesc.map(e => {
    const { date, wd } = fmt(e.date);
    const imgs = [].concat(e.images || e.image || []).filter(Boolean);
    const tags = imgs.map(src => `<img src="${escapeHtml(src)}" alt="" draggable="false">`).join('');
    const figs = imgs.length > 1
      ? `<div class="entry-figs slider">
           <div class="track" tabindex="0" aria-label="그림 ${imgs.length}장, 좌우로 넘기기">${tags}</div>
           <div class="bar"><span class="ctr">1 / ${imgs.length}</span>
             <span class="nav"><button class="prev" aria-label="이전 그림">‹</button><button class="next" aria-label="다음 그림">›</button></span></div>
         </div>`
      : imgs.length ? `<div class="entry-figs">${tags}</div>` : '';
    const albums = e.tracks ? '<div class="album-grid">' + e.tracks.map(t => `<figure class="album-card"><div class="album-cover"><img src="${escapeHtml(t.cover)}" alt="${escapeHtml(t.alt)}" width="710" height="1536" decoding="async" draggable="false"></div><figcaption>${escapeHtml(t.title)}<span class="artist">${escapeHtml(t.artist)}</span></figcaption></figure>`).join('') + '</div>' : '';
    const paras = e.text.replace(/[ \t]+$/gm, '').trim().split(/\n\s*\n/).filter(t => t.trim());
    const head = (e.title
      ? `<h2>${escapeHtml(e.title)}</h2>`
      : `<h2 class="untitled">Untitled</h2>`) + `<time datetime="${e.date}">${date} ${wd}</time>`;
    return `
      <article>
        <header class="entry-head">${head}</header>
        ${figs}
        ${albums}
        <div class="entry-body">${paras.map(t => `<p>${escapeHtml(t.trim())}</p>`).join('')}</div>
      </article>
    `;
  }).join('');

  // 여러 장 그림: 스와이프·화살표·키보드로 좌우 이동
  $list.querySelectorAll('.slider').forEach(sl => {
    const track = sl.querySelector('.track'), n = track.children.length;
    const prev = sl.querySelector('.prev'), next = sl.querySelector('.next'), ctr = sl.querySelector('.ctr');
    const at = () => Math.round(track.scrollLeft / track.clientWidth);
    const go = i => track.scrollTo({ left: Math.max(0, Math.min(n - 1, i)) * track.clientWidth });
    const sync = () => { const i = at(); ctr.textContent = `${i + 1} / ${n}`; prev.disabled = i === 0; next.disabled = i === n - 1; };
    prev.onclick = () => go(at() - 1);
    next.onclick = () => go(at() + 1);
    track.addEventListener('keydown', ev => {
      if (ev.key === 'ArrowLeft') { ev.preventDefault(); go(at() - 1); }
      if (ev.key === 'ArrowRight') { ev.preventDefault(); go(at() + 1); }
    });
    track.addEventListener('scroll', sync, { passive: true });
    sync();
  });

  function activateScatter(body) {
    const text = body.textContent;
    body.textContent = '';
    const chars = [];
    
    let word = null;
    for (const ch of text) {
      if (ch === ' ' || ch === '\n' || ch === '\t' || ch === '\r') {
        word = null;
        body.appendChild(document.createTextNode(ch));
      } else {
        if (!word) { word = document.createElement('span'); word.className = 'w'; body.appendChild(word); }
        const span = document.createElement('span');
        span.className = 'ch';
        span.textContent = ch;
        word.appendChild(span);
        chars.push(span);
      }
    }
    
    if (!chars.length) return;

    const RADIUS = 95;
    const PUSH = 34;
    const BLUR = 3.4;

    let centers = [];
    let raf = null;
    let pending = null;

    function cache() {
      centers = chars.map(c => {
        const r = c.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      });
    }

    function render() {
      raf = null;
      if (!pending) return;
      
      const { mx, my } = pending;
      
      for (let i = 0; i < chars.length; i++) {
        const c = centers[i];
        if (!c) continue;
        
        const dx = c.x - mx, dy = c.y - my;
        const dist = Math.hypot(dx, dy);
        
        if (dist < RADIUS) {
          const f = 1 - dist / RADIUS;
          const e = f * f;
          const inv = dist || 1;
          const tx = (dx / inv) * PUSH * e;
          const ty = (dy / inv) * PUSH * e;
          
          chars[i].style.transform = `translate(${tx}px, ${ty}px)`;
          chars[i].style.filter = `blur(${(BLUR * e).toFixed(2)}px)`;
          chars[i].style.opacity = (1 - 0.85 * e).toFixed(3);
        }
      }
    }

    body.addEventListener('mouseenter', cache);
    body.addEventListener('mousemove', ev => {
      pending = { mx: ev.clientX, my: ev.clientY };
      if (!raf) raf = requestAnimationFrame(render);
    });
    
    window.addEventListener('scroll', cache, { passive: true });
    window.addEventListener('resize', cache);
  }

  // 모든 entry-body 요소에 activateScatter 효과 적용
  const allBodies = $list.querySelectorAll('.entry-body p');
  allBodies.forEach(body => activateScatter(body));

})();
</script>
