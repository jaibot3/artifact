  <style>
    /* Reset & Base Variables */
    *, *::before, *::after { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    :root {
      --ink: #474039;
      --ink-3: #8b7170;
      --rule: rgba(38, 34, 30, 0.12);
      --num: #ded36ebb;
    }
    
    html, body {
      min-height: 100%;
      font-family: 'Apple Symbols', 'AppleSymbols', 'Apple Symbol', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    
    body {
      background: radial-gradient(120% 90% at 50% 0%, #F2F5E8 0%, #eff2f0 55%, #f7f6f3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 0 24px 120px; /* 상단 여백은 헤더가 아닌 .sheet에서 관리 */
    }
    
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.10;
      mix-blend-mode: multiply;
      background-image:
        radial-gradient(rgba(70,55,40,0.18) 1px, transparent 1px),
        radial-gradient(rgba(70,55,40,0.1) 1px, transparent 1px);
      background-size: 3px 3px, 7px 7px;
      background-position: 0 0, 1px 2px;
      z-index: 0;
    }
    
    /* ── 왼쪽 상단 고정 (rose 문구 타이틀 위치) ── */
    .page-header {
      position: fixed;
      top: 36px;
      left: 6%;
      z-index: 10;
      font-family: 'Apple Symbols', -apple-system, sans-serif;
      text-align: left;
    }
    
    .ph-verse {
      font-size: 30px;
      font-weight: 700;
      line-height: 42px;
      letter-spacing: 0.5px;
      color: #91908e;
      white-space: pre-wrap;
    }
    
    .ph-src {
      margin-top: 12px;
      font-size: 12px;
      font-weight: 400;
      font-style: italic;
      letter-spacing: 1px;
      color: var(--ink-3);
    }
    
    .ph-sub {
      margin-top: 16px;
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: #ded26e;
    }
    
    /* ── 오른쪽 상단 고정 (Work1 Index 위치) ── */
    .top {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding: 36px 6% 0;
      z-index: 100;
      pointer-events: none; /* 밑에 깔린 일기 본문의 스크롤/마우스 인식 방해 금지 */
    }
    
    .back {
      pointer-events: auto; /* 링크만 클릭 가능하도록 활성화 */
      font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
      font-size: 10px; 
      letter-spacing: 3px; 
      text-transform: uppercase;
      color: var(--ink-3); 
      text-decoration: none; 
      transition: color 0.3s ease;
    }
    
    .back:hover { 
      color: var(--ink); 
    }
    
    /* ── 중앙 본문 ── */
    .sheet { 
      position: relative; 
      z-index: 1; 
      width: 100%; 
      max-width: 720px; 
      padding-top: 300px; /* 고정된 시 구절과 글이 겹치지 않게 여백 확보 */
    }
    
    .entries { 
      display: flex; 
      flex-direction: column; 
      gap: 80px; 
    }
    
    .entry-meta { 
      display: flex; 
      align-items: baseline; 
      gap: 22px; 
      margin-bottom: 22px; 
    }
    
    .entry-meta .num {
      font-size: 42px; 
      line-height: 1; 
      letter-spacing: -1px;
      font-weight: normal; 
      color: var(--num);
    }
    
    .entry-meta .day {
      font-size: 30px; 
      line-height: 0.7; 
      letter-spacing: -1px;
      font-weight: normal; 
      color: var(--ink);
    }
    
    .entry-meta .rest {
      font-size: 11px; 
      letter-spacing: 4px; 
      text-transform: uppercase;
      color: var(--ink-3); 
      font-style: italic;
    }
    
    .entry-body {
      font-size: 15px; 
      line-height: 28px; 
      color: var(--ink);
      white-space: pre-wrap; 
      font-weight: 400; 
      letter-spacing: -0.2px;
      user-select: none; 
      -webkit-user-select: none; 
    }
    
    .entry-body .ch {
      display: inline-block;
      transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1),
                  filter 0.55s ease,
                  opacity 0.55s ease;
      will-change: transform, filter, opacity;
    }
    
    .entries article:not(:first-child) { 
      opacity: 0.5; 
    }
    
    .empty {
      text-align: center; 
      font-size: 12px; 
      font-style: italic;
      color: var(--ink-3); 
      letter-spacing: 2px; 
      padding: 80px 0;
    }

    /* ── 반응형 모바일 ── */
    @media (max-width: 768px) {
      .page-header {
        position: absolute; /* 모바일에서는 화면이 좁으니 스크롤할 때 위로 밀려 올라가도록 변경 */

        left: 5%;
        right: 5%;
      }
      .ph-verse {
        font-size: 24px;
        line-height: 34px;
      }
      .top {
        padding: 36px 5% 0;
      }
      .sheet {
        padding-top: 300px;
      }
    }
  </style>
</head>
<body oncontextmenu="return false" oncopy="return false">

  </div>

(() => {
  const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const WEEKDAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  const $list = document.getElementById('entries');

  if (!ENTRIES.length) { 
    $list.innerHTML = '<div class="empty">no entries yet.</div>'; 
    return; 
  }

  const sortedAsc = [...ENTRIES].sort((a, b) => a.date.localeCompare(b.date));
  sortedAsc.forEach((e, i) => { e.__num = i + 1; });
  const sortedDesc = [...sortedAsc].reverse();

  function fmt(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return { 
      day: String(d).padStart(2, '0'), 
      rest: `${MONTHS[m - 1]} ${y} · ${WEEKDAYS[dt.getDay()]}` 
    };
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[c]);
  }

  $list.innerHTML = sortedDesc.map(e => {
    const { day, rest } = fmt(e.date);
    return `
      <article>
        <div class="entry-meta">
          <span class="num">${String(e.__num).padStart(2, '0')}</span>
          <span class="day">${day}</span>
          <span class="rest">${rest}</span>
        </div>
        <div class="entry-body">${escapeHtml(e.text)}</div>
      </article>
    `;
  }).join('');

  function activateScatter(body) {
    const text = body.textContent;
    body.textContent = '';
    const chars = [];
    
    for (const ch of text) {
      if (ch === ' ' || ch === '\n' || ch === '\t' || ch === '\r') {
        body.appendChild(document.createTextNode(ch));
      } else {
        const span = document.createElement('span');
        span.className = 'ch';
        span.textContent = ch;
        body.appendChild(span);
        chars.push(span);
      }
    }
    
    if (!chars.length) return;

    const RADIUS = 95;
    const PUSH = 34;
    const BLUR = 3.4;

    let centers = [];
    let raf = null;
    let pending = null;

    function cache() {
      centers = chars.map(c => {
        const r = c.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      });
    }

    function render() {
      raf = null;
      if (!pending) return;
      
      const { mx, my } = pending;
      
      for (let i = 0; i < chars.length; i++) {
        const c = centers[i];
        if (!c) continue;
        
        const dx = c.x - mx, dy = c.y - my;
        const dist = Math.hypot(dx, dy);
        
        if (dist < RADIUS) {
          const f = 1 - dist / RADIUS;
          const e = f * f;
          const inv = dist || 1;
          const tx = (dx / inv) * PUSH * e;
          const ty = (dy / inv) * PUSH * e;
          
          chars[i].style.transform = `translate(${tx}px, ${ty}px)`;
          chars[i].style.filter = `blur(${(BLUR * e).toFixed(2)}px)`;
          chars[i].style.opacity = (1 - 0.85 * e).toFixed(3);
        }
      }
    }

    body.addEventListener('mouseenter', cache);
    body.addEventListener('mousemove', ev => {
      pending = { mx: ev.clientX, my: ev.clientY };
      if (!raf) raf = requestAnimationFrame(render);
    });
    
    window.addEventListener('scroll', cache, { passive: true });
    window.addEventListener('resize', cache);
  }

  // 모든 entry-body 요소에 activateScatter 효과 적용
  const allBodies = $list.querySelectorAll('.entry-body');
  allBodies.forEach(body => activateScatter(body));

})();
</script>
